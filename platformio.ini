[platformio]
src_dir = main

default_envs = esp32s3
; default_envs = esp32dev

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
framework = espidf
platform = espressif32@6.11.0
extra_scripts = pre:platformio_pre.py
board_build.partitions = partitions_singleapp_large.csv

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DPIN_NUM_MISO=13
    -DPIN_NUM_MOSI=11
    -DPIN_NUM_CLK=12
    -DPIN_NUM_CS=10
    -DI2C_MASTER_SDA_IO=8
    -DI2C_MASTER_SCL_IO=9
; board = 4d_systems_esp32s3_gen4_r8n16
; board_build.mcu = esp32s3
; board_upload.flash_size = 8MB
; ; board_upload.flash_size = 16MB
; ; board_build.partitions = default_16MB.csv
; build_flags = ${env.build_flags}
;             '-DCORE_DEBUG_LEVEL=0' ; 0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose
;     ; -DBOARD_HAS_PSRAM
;     ; -mfix-esp32-psram-cache-issue
;     ; -mfix-esp32-psram-cache-strategy=memw
;     -DSOC_WIFI_SUPPORTED=1

[env:esp32c3]
board = esp32-c3-devkitm-1

board_build.flash_mode = dio

build_flags =
    -DSX1302_SPI_HOST=SPI2_HOST
    -DPIN_NUM_MISO=9
    -DPIN_NUM_MOSI=10
    -DPIN_NUM_CLK=8
    -DPIN_NUM_CS=5
    -DI2C_MASTER_SDA_IO=6
    -DI2C_MASTER_SCL_IO=7
    -DGPS_UART_TXD=0
    -DGPS_UART_RXD=1
    -DUSER_BUTTON_1=2
    -DUSER_BUTTON_2=3
    -DSX1302_RESET_PIN=4
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC
    -DBLINK_GPIO=GPIO_NUM_NC
    -DLED_BLUE_GPIO=GPIO_NUM_NC
    -DLED_GREEN_GPIO=GPIO_NUM_NC
    -DLED_RED_GPIO=GPIO_NUM_NC

[env:nodo]
board = esp32-c3-devkitm-1

board_build.flash_mode = dio

build_flags =
    -DSX1302_SPI_HOST=SPI2_HOST
    -DPIN_NUM_CLK=4
    -DPIN_NUM_MISO=5
    -DPIN_NUM_MOSI=6
    -DPIN_NUM_CS=7
    -DI2C_MASTER_SDA_IO=8
    -DI2C_MASTER_SCL_IO=9
    -DSX1302_RESET_PIN=10
    -DGPS_UART_TXD=GPIO_NUM_NC
    -DGPS_UART_RXD=GPIO_NUM_NC
    -DUSER_BUTTON_1=GPIO_NUM_NC
    -DUSER_BUTTON_2=GPIO_NUM_NC
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC
    -DBLINK_GPIO=GPIO_NUM_NC
    -DLED_BLUE_GPIO=GPIO_NUM_NC
    -DLED_GREEN_GPIO=GPIO_NUM_NC
    -DLED_RED_GPIO=GPIO_NUM_NC