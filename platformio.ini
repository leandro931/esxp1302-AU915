[platformio]
src_dir = main

; default_envs = esp32s3
default_envs = pico

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
framework = espidf
platform = espressif32@6.11.0
; platform_packages = framework-espidf@symlink://C:\Espressif\frameworks\esp-idf-v4.2.4
platform_packages = 
    framework-espidf@symlink://C:\Espressif\frameworks\esp-idf-v4.2.4
    tool-idf@~1.0.1
extra_scripts = pre:platformio_pre.py
board_build.partitions = partitions_singleapp_large.csv

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DPIN_NUM_MISO=13
    -DPIN_NUM_MOSI=11
    -DPIN_NUM_CLK=12
    -DPIN_NUM_CS=10
    -DI2C_MASTER_SDA_IO=8
    -DI2C_MASTER_SCL_IO=9
    -DUSER_BUTTON_1=4
    -DUSER_BUTTON_2=5
    -DSX1302_RESET_PIN=17
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC

[env:pico]
board = pico32
build_flags =
    -DPIN_NUM_MISO=19
    -DPIN_NUM_MOSI=23
    -DPIN_NUM_CLK=18
    -DPIN_NUM_CS=5
    -DI2C_MASTER_SDA_IO=21
    -DI2C_MASTER_SCL_IO=22
    -DUSER_BUTTON_1=35
    -DUSER_BUTTON_2=34
    ; -DUSER_BUTTON_1=GPIO_NUM_NC
    ; -DUSER_BUTTON_2=GPIO_NUM_NC
    -DSX1302_RESET_PIN=14
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC
    ; -DLED_BLUE_GPIO=26
    ; -DLED_GREEN_GPIO=33
    ; -DLED_RED_GPIO=25

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    -DSX1302_SPI_HOST=SPI2_HOST
    -DPIN_NUM_MISO=9
    -DPIN_NUM_MOSI=10
    -DPIN_NUM_CLK=8
    -DPIN_NUM_CS=5
    -DI2C_MASTER_SDA_IO=6
    -DI2C_MASTER_SCL_IO=7
    -DGPS_UART_TXD=0
    -DGPS_UART_RXD=1
    -DUSER_BUTTON_1=2
    -DUSER_BUTTON_2=3
    -DSX1302_RESET_PIN=4
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC
    -DBLINK_GPIO=GPIO_NUM_NC
    -DLED_BLUE_GPIO=GPIO_NUM_NC
    -DLED_GREEN_GPIO=GPIO_NUM_NC
    -DLED_RED_GPIO=GPIO_NUM_NC